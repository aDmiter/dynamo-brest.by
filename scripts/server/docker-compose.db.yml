services:
  dynamo-mysql:
    image: mysql:8.0
    container_name: dynamo-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: dynamo_brest
      MYSQL_USER: dynamo
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - dynamo-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --lower-case-table-names=1

volumes:
  dynamo-mysql-data:
